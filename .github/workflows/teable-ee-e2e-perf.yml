# Temporary issue-branch validation; restore the original workflow after collecting evidence.
name: Teable EE e2e perf
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stream-contract-check:
    if: github.ref == 'refs/heads/T8388-delete-operation-runner'
    name: Request-local stream contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - run: pnpm install --frozen-lockfile
      - name: Format only changed source
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACMR', '-z',
            '571e3026f2ccce0def69381f8bd3bfcf8dfc07a2', 'HEAD']).toString().split('\0')
            .filter(path => /\.(ts|js|json|md)$/.test(path));
          if (files.length) execFileSync('pnpm', ['exec', 'prettier', '--write', ...files], { stdio: 'inherit' });
          NODE
      - name: Exercise native SSE reader and TypeScript syntax
        run: pnpm check:sse && pnpm check:ts
      - name: Collect formatted source
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 't8388-companion-source');
          mkdirSync(root, { recursive: true });
          const files = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACMR', '-z', 'HEAD'])
            .toString().split('\0').filter(Boolean);
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const manifest = { revision: process.env.GITHUB_SHA, files: [] };
          for (const path of files) {
            const target = join(root, 'files', path);
            mkdirSync(dirname(target), { recursive: true });
            copyFileSync(path, target);
            manifest.files.push({ path, before: digest(execFileSync('git', ['show', `HEAD:${path}`])),
              after: digest(readFileSync(path)) });
          }
          writeFileSync(join(root, 'manifest.json'), JSON.stringify(manifest, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t8388-companion-source-${{ github.run_id }}
          path: ${{ runner.temp }}/t8388-companion-source
          if-no-files-found: error
          retention-days: 7
